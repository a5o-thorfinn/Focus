<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Focus</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="./icon.png">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#343434">
</head>
<body>

    <!-- ==================== 1. صفحة التركيز (Focus) ==================== -->
    <div id="focus-page">
        <!-- زر إعادة الضبط في أعلى الشمال -->
       <button id="reset-btn" title="Reset Timer">🔄</button>
        
        <!-- زر الإعدادات (علامة الترس) في أعلى اليمين -->
        <button id="settings-btn" title="Settings">⚙️</button>

        <h1>Focus</h1>
        <p>Focus on your work</p>

        <h2 id="timer">00:00:00:00</h2>

        <div class="controls">
            <button id="start-btn">START</button>
            <button id="pause-btn" style="display: none;">PAUSE</button>
            <button id="stop-btn" style="display: none;">STOP / BREAK</button>
        </div>
    </div>

    <!-- نافذة الإعدادات المنبثقة (Pop-up Modal) -->
    <div id="settings-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>Settings</h3>
            <label for="break-ratio-select">Break Percentage:</label>
            <select id="break-ratio-select">
                <option value="0.2">20% (0.2)</option>
                <option value="0.3" selected>30% (0.3)</option>
                <option value="0.4">40% (0.4)</option>
                <option value="0.5">50% (0.5)</option>
            </select>
            
            <!-- المثال التوضيحي بالنص النظيف -->
            <p id="break-example"></p>
            
            <button id="close-settings-btn">Save & Close</button>
        </div>
    </div>

    <!-- ==================== 2. صفحة البريك (Break) ==================== -->
    <div id="break-page" style="display: none;">
        <h1>Break</h1>
        <p>Take a breath and relax!</p>

        <!-- عداد تنازلي للبريك بالثواني العادية -->
        <h2 id="break-timer">00:00:00</h2>

        <div class="controls">
            <!-- (سيتم إدراج زر الـ Pause للبريك برمجياً هنا بجانب زر العودة) -->
            <button id="finish-break-btn">BACK TO FOCUS</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
